<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <style>
      .mono{font-family:'Courier New',ui-monospace,monospace}
      .dim{fill:#a3a3a3}
      .txt{fill:#e5e5e5}
      .wht{fill:#ffffff}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#050505"/>

  <rect x="0" y="0" width="1200" height="46" fill="#09090b"/>
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#27272a"/>
  <text class="mono dim" x="28" y="30" font-size="13" letter-spacing="1.5">DAILY DOSE // ADDICT MATH, RUN BACKWARDS</text>
  <circle cx="1074" cy="25" r="4" fill="#10b981"/>
  <text class="mono" x="1086" y="30" font-size="13" fill="#10b981" letter-spacing="1">PER DAY</text>

  <text class="mono" x="28" y="96" font-size="12" fill="#ef4444" letter-spacing="3">YOU ALREADY PROVED YOU CAN AFFORD IT</text>
  <text class="wht" x="28" y="136" font-size="34" font-weight="700">What Rebuilding Costs vs. What Wrecking Cost</text>
  <text class="dim mono" x="28" y="166" font-size="14">Nobody in active addiction was ever broke on a Friday. Same wallet. Different ledger.</text>
  <line x1="28" y1="192" x2="1172" y2="192" stroke="#27272a"/>

  <!-- axis -->
  <text class="mono dim" x="360" y="236" font-size="11">$0</text>
  <text class="mono dim" x="560" y="236" font-size="11">$5</text>
  <text class="mono dim" x="760" y="236" font-size="11">$10</text>
  <text class="mono dim" x="960" y="236" font-size="11">$15</text>
  <text class="mono dim" x="1148" y="236" font-size="11">$20</text>
  <line x1="360" y1="246" x2="1160" y2="246" stroke="#27272a"/>

  <!-- bar 1: core five -->
  <text x="340" y="284" font-size="14" class="wht" text-anchor="end">The Core Five</text>
  <text x="340" y="302" font-size="10.5" class="mono dim" text-anchor="end">creatine · tyrosine · B · mag · salt</text>
  <rect x="360" y="266" width="22" height="42" fill="#10b981"/>
  <text x="396" y="293" font-size="16" font-weight="700" fill="#10b981">$0.55</text>
  <text x="462" y="293" font-size="12" class="mono dim">/ day — the whole neurochemical floor</text>

  <!-- bar 2: full ledger -->
  <text x="340" y="356" font-size="14" class="wht" text-anchor="end">Full DD Ledger</text>
  <text x="340" y="374" font-size="10.5" class="mono dim" text-anchor="end">supplements + all superfoods</text>
  <rect x="360" y="338" width="212" height="42" fill="#f59e0b"/>
  <text x="586" y="365" font-size="16" font-weight="700" fill="#f59e0b">$5.30</text>
  <text x="652" y="365" font-size="12" class="mono dim">/ day — including real food</text>

  <!-- bar 3: one drink -->
  <text x="340" y="428" font-size="14" class="wht" text-anchor="end">One Drink Out</text>
  <text x="340" y="446" font-size="10.5" class="mono dim" text-anchor="end">a single pour, with tip</text>
  <rect x="360" y="410" width="360" height="42" fill="#3f3f46"/>
  <text x="734" y="437" font-size="16" font-weight="700" class="txt">$9.00</text>

  <!-- bar 4: a fifth -->
  <text x="340" y="500" font-size="14" class="wht" text-anchor="end">A Fifth, Daily</text>
  <text x="340" y="518" font-size="10.5" class="mono dim" text-anchor="end">the quiet at-home number</text>
  <rect x="360" y="482" width="720" height="42" fill="#ef4444"/>
  <text x="1094" y="509" font-size="16" font-weight="700" fill="#ef4444">$18.00</text>

  <!-- bar 5: broken scale -->
  <text x="340" y="572" font-size="14" class="wht" text-anchor="end">One Saturday</text>
  <text x="340" y="590" font-size="10.5" class="mono dim" text-anchor="end">the night you don't fully remember</text>
  <rect x="360" y="554" width="740" height="42" fill="#ef4444" opacity="0.35"/>
  <path d="M 1074 550 l 14 0 l -14 50 l 14 0" fill="none" stroke="#050505" stroke-width="7"/>
  <path d="M 1090 550 l 14 0 l -14 50 l 14 0" fill="none" stroke="#050505" stroke-width="7"/>
  <text x="1114" y="581" font-size="16" font-weight="700" fill="#ef4444">$500</text>
  <text x="1160" y="612" font-size="10.5" class="mono dim" text-anchor="end">scale broken — bar would run 40 screens wide</text>

  <!-- summary panels -->
  <line x1="28" y1="648" x2="1172" y2="648" stroke="#27272a"/>

  <g>
    <rect x="28" y="672" width="368" height="104" rx="4" fill="#09090b" stroke="#27272a"/>
    <text x="52" y="704" font-size="30" font-weight="700" fill="#10b981">$49.50</text>
    <text x="52" y="730" font-size="12.5" class="txt">is the Core Five for all 90 days.</text>
    <text x="52" y="750" font-size="12.5" class="txt">One-tenth of a single Saturday.</text>
  </g>

  <g>
    <rect x="416" y="672" width="368" height="104" rx="4" fill="#09090b" stroke="#27272a"/>
    <text x="440" y="704" font-size="30" font-weight="700" fill="#f59e0b">$16.50</text>
    <text x="440" y="730" font-size="12.5" class="txt">is the entire 30-day Core Five.</text>
    <text x="440" y="750" font-size="12.5" class="txt">Less than two drinks.</text>
  </g>

  <g>
    <rect x="804" y="672" width="368" height="104" rx="4" fill="#09090b" stroke="#27272a"/>
    <text x="828" y="704" font-size="30" font-weight="700" fill="#ef4444">$6,570</text>
    <text x="828" y="730" font-size="12.5" class="txt">is the fifth-a-day, annualized.</text>
    <text x="828" y="750" font-size="12.5" class="txt">The money was never the problem.</text>
  </g>

  <text x="28" y="802" font-size="11.5" class="dim">Costs are US retail estimates, July 2026, buying in bulk. Your prices will vary. The ratio won't.</text>
  <text class="mono" x="1172" y="802" font-size="12" fill="#f59e0b" text-anchor="end">aafiends.com/90rr</text>
</svg>
